<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Yash Paudel</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Libre+Baskerville:ital,wght@0,400;0,700;1,400;1,700&family=Courier+Prime:ital@0;1&display=swap" rel="stylesheet">
  <meta name="description" content="Yash Paudel — AI researcher and builder working at the edge of what AI can actually do. Fine-tuning LLMs for Nepal's fintech.">
  <style>

    /* ── RESET ── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    /* ── DESIGN TOKENS ── */
    :root {
      --paper:      #f5f2eb;
      --ink:        #1a1a1a;
      --ink-soft:   #555555;
      --ink-muted:  #999999;
      --ink-faint:  #d8d4cc;
      --crimson:    #c0392b;
      --paper-warm: #eee8da;
      --paper-rgb:  245,242,235;
      --serif:      'Libre Baskerville', Georgia, serif;
      --mono:       'Courier Prime', 'Courier New', monospace;
    }

    /* ── BASE ── */
    html {
      scroll-snap-type: y mandatory;
      overflow-y: scroll;
      background: var(--paper);
      color: var(--ink);
      font-family: var(--serif);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    body { background: var(--paper); }

    /* ── SCROLLBAR ── */
    ::-webkit-scrollbar { width: 0; }

    /* ── CHAPTERS ── */
    section.chapter {
      scroll-snap-align: start;
      min-height: 100svh;
      width: 100%;
      position: relative;
      display: flex;
      flex-direction: column;
      justify-content: center;
      padding: clamp(3rem, 8vw, 5rem) clamp(2rem, 8vw, 6rem);
    }

    /* ── INK REVEAL ── */
    .ink {
      clip-path: inset(0 100% 0 0);
      transition: clip-path 0.5s cubic-bezier(0.4, 0, 0.2, 1);
      display: inline-block;
    }
    .ink.revealed { clip-path: inset(0 0% 0 0); }

    /* Block elements need display:block not inline */
    p.ink, div.ink, h1.ink, h2.ink, h3.ink { display: block; }

    /* ── REDUCED MOTION ── */
    @media (prefers-reduced-motion: reduce) {
      .ink { clip-path: none !important; transition: none !important; }
    }

    /* ── PROGRESS RAIL ── */
    #progress-rail {
      position: fixed;
      right: 0; top: 0;
      width: 2px; height: 100%;
      background: var(--ink-faint);
      z-index: 200;
    }
    #progress-fill {
      width: 100%; height: 0%;
      background: var(--crimson);
      transition: height 0.08s linear;
    }

    /* ── CHAPTER LABEL ── */
    #chapter-label {
      position: fixed;
      left: 16px;
      top: 50%;
      transform: translateY(-50%) rotate(-90deg);
      font-family: var(--mono);
      font-size: 9px;
      letter-spacing: 4px;
      text-transform: uppercase;
      color: var(--ink-faint);
      z-index: 200;
      white-space: nowrap;
      pointer-events: none;
      transition: opacity 0.3s ease;
    }

    /* ── NAV ── */
    nav {
      position: fixed;
      top: 0; left: 0; right: 0;
      z-index: 200;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 0.9rem clamp(2rem, 8vw, 6rem);
      background: rgba(var(--paper-rgb),0.92);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      border-bottom: 1px solid var(--ink-faint);
    }
    .nav-logo {
      font-family: var(--serif);
      font-weight: 700;
      font-size: 1rem;
      color: var(--ink);
      text-decoration: none;
      letter-spacing: 0.05em;
    }
    .nav-logo:hover { color: var(--crimson); }
    .nav-play {
      font-family: var(--mono);
      font-size: 0.65rem;
      letter-spacing: 0.2em;
      color: var(--ink-muted);
      text-decoration: none;
      transition: color 0.2s ease;
    }
    .nav-play:hover { color: var(--crimson); }

    /* ── CHAPTER 00 — COVER ── */
    #chapter-00 {
      justify-content: space-between;
      padding-top: calc(clamp(3rem, 8vw, 5rem) + 3rem);
    }

    .cover-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid var(--ink-faint);
      padding-bottom: 0.75rem;
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .cover-main { flex: 1; display: flex; flex-direction: column; justify-content: center; padding: 2rem 0; }

    .cover-label {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.3em;
      text-transform: uppercase;
      color: var(--crimson);
      margin-bottom: 1.2rem;
    }

    .cover-headline {
      font-size: clamp(2.4rem, 6.5vw, 5.5rem);
      font-weight: 700;
      font-style: italic;
      line-height: 1.05;
      letter-spacing: -0.02em;
      color: var(--ink);
      margin-bottom: 1.5rem;
    }
    .cover-headline em { color: var(--crimson); font-style: inherit; }
    .cover-line { display: block; }

    .cover-sub {
      font-family: var(--mono);
      font-size: 0.6rem;
      letter-spacing: 0.15em;
      text-transform: uppercase;
      color: var(--ink-muted);
    }

    .cover-bottom {
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
      border-top: 1px solid var(--ink-faint);
      padding-top: 0.75rem;
    }

    .cover-tags {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--ink-muted);
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }
    .cover-tags .dot { color: var(--ink-faint); }

    .cover-scroll {
      font-family: var(--mono);
      font-size: 0.55rem;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: var(--crimson);
      text-decoration: none;
      transition: opacity 0.2s;
    }
    .cover-scroll:hover { opacity: 0.7; }

  </style>
</head>
<body>

  <!-- Progress rail -->
  <div id="progress-rail" aria-hidden="true">
    <div id="progress-fill"></div>
  </div>

  <!-- Chapter label (rotated, left edge) -->
  <div id="chapter-label" aria-hidden="true">00 · COVER</div>

  <!-- Nav -->
  <nav aria-label="Site navigation">
    <a href="#chapter-00" class="nav-logo">YP</a>
    <a href="game.html" class="nav-play">▸ PLAY</a>
  </nav>

  <section class="chapter" id="chapter-00" data-label="00 · COVER">

    <div class="cover-top">
      <span class="cover-byline">Yash Paudel</span>

    </div>

    <div class="cover-main">
      <div class="cover-label ink">AI Researcher · Builder</div>
      <h1 class="cover-headline">
        <span class="cover-line ink">I build models</span>
        <span class="cover-line ink">that speak <em>Nepali.</em></span>
      </h1>
      <p class="cover-sub ink">Fine-tuning · Eval Pipelines · Production AI</p>
    </div>

    <div class="cover-bottom">
      <div class="cover-tags">
        <span>LLM</span><span class="dot">·</span>
        <span>Fintech</span><span class="dot">·</span>
        <span>Nepal</span>
      </div>
      <a href="#chapter-01" class="cover-scroll" aria-label="Scroll to next chapter">Read ↓</a>
    </div>

  </section>

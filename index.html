<!DOCTYPE html><html lang="en"><head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yash Paudel</title>
  <meta name="description" content="Yash Paudel — software engineer in Nepal. Work, writing (FLUX), and a reading knowledge graph of how the ideas connect.">
  <link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
</head><body>
  <a class="skip" href="#name">Skip to content</a>

  <header class="topbar">
    <a href="#work" class="brand" data-view="work">Yash Paudel</a>
    <nav class="mainnav" aria-label="Sections">
      <a href="#work" data-view="work">Work</a>
      <a href="#flux" data-view="flux">FLUX</a>
      <a href="#reading" data-view="reading">Reading</a>
    </nav>
  </header>

  <main id="main">

    <!-- ── WORK ── -->
    <section class="view" id="view-work" aria-label="Work">
      <div class="wrap">
        <div class="hero">
          <h1 id="name"></h1>
          <p id="role" class="role"></p>
          <p id="tagline" class="tagline"></p>
          <nav id="links" class="links" aria-label="Links"></nav>
        </div>
        <section class="block"><h2>About</h2><p id="about-body"></p></section>
        <section class="block"><h2>Experience</h2><div id="experience" class="xp-list"></div></section>
        <section class="block"><h2>Selected work</h2><div id="projects" class="project-grid"></div></section>
      </div>
    </section>

    <!-- ── FLUX ── -->
    <section class="view" id="view-flux" aria-label="FLUX" hidden>
      <div class="wrap">
        <div class="view-head"><h1>FLUX</h1><p class="dim">Notes on AI, engineering, and building from Nepal.</p></div>
        <div id="posts" class="post-list"></div>
      </div>
    </section>

    <!-- ── READING ── -->
    <section class="view" id="view-reading" aria-label="Reading" hidden>
      <div class="wrap">
        <div class="view-head"><h1>Reading</h1><p class="dim">What I’m reading, and what stuck.</p></div>
        <section class="block"><h2>Currently reading</h2><div id="cr"></div></section>
        <div id="stats" class="stats"></div>
        <section class="block"><h2>Bookshelf</h2><div id="list-view"></div></section>
      </div>
    </section>

  </main>

  <aside id="panel" class="panel" hidden aria-label="Book detail"></aside>
  <footer class="wrap footer"><p>Vanilla JS · Open Library covers · on-device embeddings</p></footer>
  <script type="module" src="assets/js/main.js"></script>
</body></html>

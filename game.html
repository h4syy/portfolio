<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
<title>Coastal Drive — Yash Paudel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Courier+Prime:wght@400;700&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; overflow: hidden; background: #0a1622; }
  body {
    font-family: 'Courier Prime', monospace;
    color: #fff;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
  }
  #game { display: block; width: 100vw; height: 100vh; }

  /* ── HUD ── */
  .hud {
    position: fixed; top: 0; left: 0; right: 0;
    display: flex; justify-content: space-between; align-items: flex-start;
    padding: 1.2rem 1.4rem;
    pointer-events: none;
    z-index: 10;
    text-shadow: 0 2px 8px rgba(0,0,0,0.5);
  }
  .hud-block { display: flex; flex-direction: column; gap: 2px; }
  .hud-right { text-align: right; align-items: flex-end; }
  .hud-label {
    font-size: 0.55rem; letter-spacing: 0.25em; text-transform: uppercase;
    color: rgba(255,255,255,0.7);
  }
  .hud-val {
    font-size: 1.5rem; font-weight: 700; line-height: 1;
    color: #fff;
  }
  .hud-val.speed { color: #ffd86b; }
  .hud-unit { font-size: 0.6rem; color: rgba(255,255,255,0.6); letter-spacing: 0.1em; }

  /* ── BACK LINK ── */
  .back-link {
    position: fixed; bottom: 1.1rem; left: 1.2rem; z-index: 10;
    font-size: 0.6rem; letter-spacing: 0.22em; text-transform: uppercase;
    color: rgba(255,255,255,0.85); text-decoration: none;
    background: rgba(10,22,34,0.45); backdrop-filter: blur(8px);
    padding: 0.6rem 1rem; border: 1px solid rgba(255,255,255,0.2);
    border-radius: 6px; pointer-events: auto;
    transition: background 0.2s, border-color 0.2s;
  }
  .back-link:hover { background: rgba(10,22,34,0.7); border-color: rgba(255,255,255,0.5); }

  /* ── SOUND TOGGLE ── */
  .sound-toggle {
    position: fixed; top: 4.6rem; right: 1.2rem; z-index: 10;
    width: 2.6rem; height: 2.6rem; border-radius: 50%;
    background: rgba(10,22,34,0.45); backdrop-filter: blur(8px);
    border: 1px solid rgba(255,255,255,0.2); color: #fff;
    font-size: 0.9rem; cursor: pointer; pointer-events: auto;
    transition: background 0.2s, border-color 0.2s, opacity 0.2s;
  }
  .sound-toggle:hover { background: rgba(10,22,34,0.7); border-color: rgba(255,255,255,0.5); }
  .sound-toggle.muted { opacity: 0.4; }

  /* ── OVERLAY (start / pause) ── */
  #overlay {
    position: fixed; inset: 0; z-index: 20;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center; gap: 1.4rem;
    background: rgba(10,22,34,0.55); backdrop-filter: blur(6px);
    transition: opacity 0.4s ease;
  }
  #overlay.hidden { opacity: 0; pointer-events: none; }
  .ov-title {
    font-size: clamp(2.2rem, 8vw, 4.5rem); font-weight: 700;
    letter-spacing: 0.04em; line-height: 1;
    color: #fff; text-shadow: 0 4px 24px rgba(0,0,0,0.4);
  }
  .ov-title em { color: #ffd86b; font-style: normal; }
  .ov-sub {
    font-size: 0.8rem; letter-spacing: 0.15em; color: rgba(255,255,255,0.85);
    max-width: 30rem; line-height: 1.8;
  }
  .ov-cta {
    margin-top: 0.6rem;
    font-size: 0.85rem; letter-spacing: 0.2em; text-transform: uppercase;
    color: #0a1622; background: #ffd86b;
    padding: 0.9rem 2rem; border: none; border-radius: 8px;
    cursor: pointer; font-family: inherit; font-weight: 700;
    pointer-events: auto;
    box-shadow: 0 8px 24px rgba(255,216,107,0.35);
    transition: transform 0.15s ease, box-shadow 0.15s ease;
  }
  .ov-cta:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(255,216,107,0.45); }
  .ov-keys {
    font-size: 0.65rem; letter-spacing: 0.12em; color: rgba(255,255,255,0.6);
    line-height: 2;
  }
  .ov-keys kbd {
    background: rgba(255,255,255,0.12); border: 1px solid rgba(255,255,255,0.25);
    border-radius: 4px; padding: 1px 7px; margin: 0 2px; font-family: inherit;
  }

  /* ── TOUCH CONTROLS ── */
  #touch { position: fixed; inset: 0; z-index: 8; display: none; pointer-events: none; }
  .touch-btn {
    position: absolute; bottom: 0; width: 38%; height: 55%;
    pointer-events: auto;
  }
  .touch-left { left: 0; }
  .touch-right { right: 0; }
  .touch-gas {
    position: absolute; bottom: 5.5rem; right: 1.2rem;
    width: 4.5rem; height: 4.5rem; border-radius: 50%;
    background: rgba(255,216,107,0.85); color: #0a1622;
    display: flex; align-items: center; justify-content: center;
    font-size: 0.6rem; font-weight: 700; letter-spacing: 0.1em;
    pointer-events: auto; border: none;
  }
  @media (hover: none) and (pointer: coarse) {
    #touch { display: block; }
  }
</style>
</head>
<body>

  <canvas id="game"></canvas>

  <div class="hud">
    <div class="hud-block">
      <span class="hud-label">Distance</span>
      <span class="hud-val" id="hud-dist">0</span>
      <span class="hud-unit">METERS</span>
    </div>
    <div class="hud-block hud-right">
      <span class="hud-label">Speed</span>
      <span class="hud-val speed" id="hud-speed">0</span>
      <span class="hud-unit">KM/H · BEST <span id="hud-best">0</span>M</span>
    </div>
  </div>

  <a href="index.html" class="back-link">← back to portfolio</a>
  <button class="sound-toggle" id="sound-toggle" aria-label="Toggle sound">♪</button>

  <div id="touch">
    <div class="touch-btn touch-left"  id="t-left"></div>
    <div class="touch-btn touch-right" id="t-right"></div>
    <button class="touch-gas" id="t-gas">GAS</button>
  </div>

  <div id="overlay">
    <div class="ov-title">COASTAL <em>DRIVE</em></div>
    <div class="ov-sub">An endless cruise down a sunny coast. Ocean on your right, the resort strip on your left. No finish line — just the road, the light, and the sea.</div>
    <button class="ov-cta" id="start-btn">▸ Start Driving</button>
    <div class="ov-keys">
      <kbd>←</kbd> <kbd>→</kbd> or <kbd>A</kbd> <kbd>D</kbd> to steer &nbsp;·&nbsp;
      <kbd>↑</kbd> gas &nbsp;·&nbsp; <kbd>↓</kbd> brake &nbsp;·&nbsp; <kbd>P</kbd> pause
    </div>
  </div>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('game');
  const ctx = canvas.getContext('2d');
  let W = 0, H = 0, DPR = 1;

  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * DPR; canvas.height = H * DPR;
    canvas.style.width = W + 'px'; canvas.style.height = H + 'px';
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
  }
  resize();
  window.addEventListener('resize', resize);

  // ── CONSTANTS ──
  const SEG_LEN = 220, RUMBLE_LEN = 3, ROAD_WIDTH = 2200, LANES = 3;
  const DRAW_DIST = 260, CAM_HEIGHT = 1100, CAM_DEPTH = 0.84, FOG_DENSITY = 4;
  const MAX_SPEED = SEG_LEN * 60;
  const ACCEL = MAX_SPEED / 5, BREAKING = -MAX_SPEED, DECEL = -MAX_SPEED / 4;
  const OFF_DECEL = -MAX_SPEED / 1.6, OFF_LIMIT = MAX_SPEED / 3.5;
  const CENTRIFUGAL = 0.32;

  const COLORS = {
    LIGHT: { road:'#5b5e66', grass:'#e9c98a', rumble:'#ffffff', lane:'#ffe9b0' },
    DARK:  { road:'#54565e', grass:'#e3c082', rumble:'#c0392b', lane:'' },
    START: { road:'#ffffff', grass:'#e9c98a', rumble:'#ffffff', lane:'' },
  };

  // ── TRACK ──
  const segments = [];
  function lastY() { return segments.length === 0 ? 0 : segments[segments.length - 1].p2.world.y; }
  function addSegment(curve, y) {
    const n = segments.length, prevY = lastY();
    segments.push({
      index: n,
      p1: { world:{ y:prevY, z:n*SEG_LEN }, camera:{}, screen:{} },
      p2: { world:{ y:y, z:(n+1)*SEG_LEN }, camera:{}, screen:{} },
      curve, sprites: [], _clip: H,
      color: Math.floor(n / RUMBLE_LEN) % 2 ? COLORS.DARK : COLORS.LIGHT,
    });
  }
  function easeInOut(a,b,p){ return a + (b-a)*((-Math.cos(p*Math.PI)/2)+0.5); }
  function addRoad(enter, hold, leave, curve, height) {
    const startY = lastY(), endY = startY + height*SEG_LEN, total = enter+hold+leave;
    for (let i=0;i<enter;i++) addSegment(easeInOut(0,curve,i/enter), easeInOut(startY,endY,i/total));
    for (let i=0;i<hold;i++)  addSegment(curve,                       easeInOut(startY,endY,(enter+i)/total));
    for (let i=0;i<leave;i++) addSegment(easeInOut(curve,0,i/leave),  easeInOut(startY,endY,(enter+hold+i)/total));
  }
  const C = { EASY:2, MED:4, HARD:6 }, HILL = { LOW:20, MED:40, HIGH:60 };

  function buildTrack() {
    segments.length = 0;
    addRoad(40,40,40, 0, 0);
    addRoad(50,50,50, C.MED, HILL.LOW);
    addRoad(40,30,40, -C.EASY, -HILL.LOW);
    addRoad(60,40,60, 0, HILL.MED);
    addRoad(40,40,40, -C.HARD, 0);
    addRoad(30,40,30, 0, -HILL.MED);
    addRoad(50,50,50, C.HARD, HILL.LOW);
    addRoad(40,30,40, C.EASY, 0);
    addRoad(60,60,60, -C.MED, HILL.HIGH);
    addRoad(40,40,40, 0, -HILL.HIGH);
    addRoad(50,40,50, C.MED, 0);
    addRoad(40,80,40, 0, HILL.LOW);
    addRoad(40,40,40, -C.EASY, 0);
    for (let i=0;i<RUMBLE_LEN;i++) if (segments[i]) segments[i].color = COLORS.START;
    placeScenery();
    placeTraffic();
  }

  function placeScenery() {
    let n = 20;
    while (n < segments.length) {
      const seg = segments[n];
      const r = Math.random();
      if (r < 0.5)      seg.sprites.push({ type:'palm', side:1, offset:1.25 + Math.random()*1.6 });
      else if (r < 0.7) seg.sprites.push({ type:'umbrella', side:1, offset:1.15 + Math.random()*0.5, hue:Math.floor(Math.random()*4) });
      const l = Math.random();
      if (l < 0.45)      seg.sprites.push({ type:'building', side:-1, offset:1.3 + Math.random()*1.8, h:0.6 + Math.random()*1.2, hue:Math.floor(Math.random()*3) });
      else if (l < 0.65) seg.sprites.push({ type:'palm', side:-1, offset:1.2 + Math.random()*0.5 });
      n += 6 + Math.floor(Math.random()*6);
    }
  }

  const TRAFFIC_COLORS = ['#e74c3c','#3498db','#2ecc71','#f39c12','#9b59b6','#ecf0f1'];
  const traffic = [];
  function placeTraffic() {
    traffic.length = 0;
    const count = Math.floor(segments.length / 60);
    for (let i=0;i<count;i++) {
      traffic.push({
        offset: (Math.random()<0.5?-1:1) * (0.15 + Math.random()*0.7),
        z: Math.floor(Math.random()*segments.length) * SEG_LEN,
        speed: MAX_SPEED/4 + Math.random()*(MAX_SPEED/4),
        color: TRAFFIC_COLORS[i % TRAFFIC_COLORS.length],
      });
    }
  }

  // ── STATE ──
  let position = 0, playerX = 0, speed = 0, distance = 0;
  let best = +(localStorage.getItem('coastal:best') || 0);
  let trackLength = 0, running = false, paused = false;
  const keys = { left:false, right:false, gas:false, brake:false };

  function trackLen(){ return segments.length * SEG_LEN; }
  function findSegment(z){ return segments[Math.floor(z/SEG_LEN) % segments.length]; }

  function project(p, camX, camY, camZ) {
    p.camera.x = (p.world.x||0) - camX;
    p.camera.y = (p.world.y||0) - camY;
    p.camera.z = (p.world.z||0) - camZ;
    p.screen.scale = CAM_DEPTH / p.camera.z;
    p.screen.x = Math.round((W/2) + (p.screen.scale * p.camera.x * W/2));
    p.screen.y = Math.round((H/2) - (p.screen.scale * p.camera.y * H/2));
    p.screen.w = Math.round(p.screen.scale * ROAD_WIDTH * W/2);
  }

  // ── UPDATE ──
  function update(dt) {
    const playerSeg = findSegment(position + CAM_HEIGHT);
    const speedPct = speed / MAX_SPEED;
    const dx = dt * 2 * speedPct;

    position += speed * dt;
    while (position >= trackLength) position -= trackLength;
    while (position < 0) position += trackLength;

    if (keys.left)  playerX -= dx;
    if (keys.right) playerX += dx;
    playerX -= dx * speedPct * playerSeg.curve * CENTRIFUGAL;

    if (keys.gas)        speed += ACCEL * dt;
    else if (keys.brake) speed += BREAKING * dt;
    else                 speed += DECEL * dt;

    if ((playerX < -1 || playerX > 1) && speed > OFF_LIMIT) speed += OFF_DECEL * dt;

    // tire screech on hard curves at speed
    if (Math.abs(playerSeg.curve) > 3.5 && speedPct > 0.55)
      Sound.screech((Math.abs(playerSeg.curve)/6) * speedPct);

    playerX = Math.max(-2, Math.min(2, playerX));
    speed   = Math.max(0, Math.min(speed, MAX_SPEED));

    const pSeg = findSegment(position + CAM_HEIGHT);
    for (const car of traffic) {
      car.z = (car.z + car.speed * dt) % trackLength;
      const carSeg = findSegment(car.z);
      if (carSeg.index === pSeg.index && speed > car.speed && Math.abs(playerX - car.offset) < 0.55) {
        speed = car.speed * 0.6;
        playerX += (playerX > car.offset ? 1 : -1) * 0.04;
      }
    }

    distance += (speed * dt) / 180;
    if (distance > best) { best = distance; localStorage.setItem('coastal:best', Math.floor(best)); }
  }

  // ── BACKGROUND ──
  let bgShift = 0;
  function renderBackground(playerSeg) {
    const horizon = H * 0.5;
    const sky = ctx.createLinearGradient(0, 0, 0, horizon);
    sky.addColorStop(0,'#3a8fd4'); sky.addColorStop(0.55,'#8fc7e8'); sky.addColorStop(1,'#ffe1a8');
    ctx.fillStyle = sky; ctx.fillRect(0, 0, W, horizon + 2);

    const shift = -(bgShift * 0.6 + playerX * 30);

    // sun
    const sunX = W*0.68 + shift*0.3, sunY = horizon - H*0.13, sunR = Math.min(W,H)*0.09;
    const glow = ctx.createRadialGradient(sunX, sunY, 0, sunX, sunY, sunR*3.2);
    glow.addColorStop(0,'rgba(255,240,200,0.95)'); glow.addColorStop(0.3,'rgba(255,216,107,0.55)'); glow.addColorStop(1,'rgba(255,216,107,0)');
    ctx.fillStyle = glow; ctx.fillRect(0, 0, W, horizon);
    ctx.fillStyle = '#fff6df';
    ctx.beginPath(); ctx.arc(sunX, sunY, sunR, 0, Math.PI*2); ctx.fill();

    // ocean (right)
    const oceanTop = horizon - H*0.05;
    ctx.save();
    ctx.beginPath(); ctx.rect(W*0.42, oceanTop, W, horizon-oceanTop+3); ctx.clip();
    const ocean = ctx.createLinearGradient(0, oceanTop, 0, horizon+3);
    ocean.addColorStop(0,'#2b86c5'); ocean.addColorStop(1,'#1c6aa8');
    ctx.fillStyle = ocean; ctx.fillRect(W*0.42, oceanTop, W, horizon-oceanTop+3);
    ctx.strokeStyle = 'rgba(255,255,255,0.35)'; ctx.lineWidth = 1;
    for (let i=0;i<6;i++) {
      const y = oceanTop + (i/6)*(horizon-oceanTop) + ((bgShift*0.5)%8);
      ctx.globalAlpha = 0.5 - i*0.06;
      ctx.beginPath(); ctx.moveTo(W*0.42, y); ctx.lineTo(W, y); ctx.stroke();
    }
    ctx.globalAlpha = 1;
    ctx.fillStyle = 'rgba(255,240,200,0.4)';
    ctx.fillRect(sunX - sunR*0.6, oceanTop, sunR*1.2, horizon-oceanTop);
    ctx.restore();

    // resort skyline (left)
    ctx.save();
    ctx.beginPath(); ctx.rect(0, 0, W*0.46, horizon+2); ctx.clip();
    const baseY = horizon, bcols = ['#c98a6a','#d9a07d','#b87a5c'];
    let bx = (shift*0.4)%90 - 90, i = 0;
    while (bx < W*0.5) {
      const bw = 30 + (i%4)*16, bh = H*(0.06 + ((i*37)%11)*0.012);
      ctx.fillStyle = bcols[i%3]; ctx.fillRect(bx, baseY-bh, bw, bh);
      ctx.fillStyle = 'rgba(255,240,200,0.55)';
      for (let wy=baseY-bh+6; wy<baseY-4; wy+=10)
        for (let wx=bx+4; wx<bx+bw-4; wx+=9) ctx.fillRect(wx, wy, 4, 5);
      bx += bw + 10; i++;
    }
    ctx.restore();

    const haze = ctx.createLinearGradient(0, horizon-30, 0, horizon+4);
    haze.addColorStop(0,'rgba(255,225,168,0)'); haze.addColorStop(1,'rgba(255,225,168,0.5)');
    ctx.fillStyle = haze; ctx.fillRect(0, horizon-30, W, 34);
  }

  // ── ROAD ──
  function rumbleWidth(w){ return w / Math.max(6, 2*LANES); }
  function laneMarkWidth(w){ return w / Math.max(32, 8*LANES); }
  function polygon(x1,y1,x2,y2,x3,y3,x4,y4,color){
    ctx.fillStyle = color; ctx.beginPath();
    ctx.moveTo(x1,y1); ctx.lineTo(x2,y2); ctx.lineTo(x3,y3); ctx.lineTo(x4,y4);
    ctx.closePath(); ctx.fill();
  }

  function renderRoad(baseSeg, basePercent) {
    let maxY = H, x = 0, dx = -(baseSeg.curve * basePercent);
    const camX = playerX * ROAD_WIDTH, camY = CAM_HEIGHT + baseSeg.p1.world.y;
    for (let i=0;i<DRAW_DIST;i++) {
      const seg = segments[(baseSeg.index + i) % segments.length];
      const looped = (baseSeg.index + i) >= segments.length;
      const camZ = position - (looped ? trackLength : 0);
      const fog = Math.pow(1/Math.E, (i/DRAW_DIST)*(i/DRAW_DIST)*FOG_DENSITY);
      project(seg.p1, camX - x,      camY, camZ);
      project(seg.p2, camX - x - dx, camY, camZ);
      x += dx; dx += seg.curve;
      seg._clip = maxY;
      if (seg.p1.camera.z <= CAM_DEPTH || seg.p2.screen.y >= seg.p1.screen.y || seg.p2.screen.y >= maxY) continue;
      drawSegment(seg, fog);
      maxY = seg.p2.screen.y;
    }
  }

  function drawSegment(seg, fog) {
    const p1 = seg.p1.screen, p2 = seg.p2.screen, c = seg.color;
    ctx.fillStyle = c.grass; ctx.fillRect(0, p2.y, W, p1.y - p2.y);
    const r1 = rumbleWidth(p1.w), r2 = rumbleWidth(p2.w);
    polygon(p1.x-p1.w-r1, p1.y, p1.x-p1.w, p1.y, p2.x-p2.w, p2.y, p2.x-p2.w-r2, p2.y, c.rumble);
    polygon(p1.x+p1.w+r1, p1.y, p1.x+p1.w, p1.y, p2.x+p2.w, p2.y, p2.x+p2.w+r2, p2.y, c.rumble);
    polygon(p1.x-p1.w, p1.y, p1.x+p1.w, p1.y, p2.x+p2.w, p2.y, p2.x-p2.w, p2.y, c.road);
    if (c.lane) {
      const l1 = laneMarkWidth(p1.w), l2 = laneMarkWidth(p2.w);
      const lw1 = (p1.w*2)/LANES, lw2 = (p2.w*2)/LANES;
      let lx1 = p1.x-p1.w+lw1, lx2 = p2.x-p2.w+lw2;
      for (let l=1;l<LANES;l++) {
        polygon(lx1-l1/2, p1.y, lx1+l1/2, p1.y, lx2+l2/2, p2.y, lx2-l2/2, p2.y, c.lane);
        lx1 += lw1; lx2 += lw2;
      }
    }
    if (fog < 1) {
      ctx.globalAlpha = 1 - fog; ctx.fillStyle = '#ffe1a8';
      ctx.fillRect(0, p2.y, W, p1.y - p2.y); ctx.globalAlpha = 1;
    }
  }

  // ── SPRITES ──
  function renderSprites(baseSeg) {
    for (let i=DRAW_DIST-1;i>0;i--) {
      const seg = segments[(baseSeg.index + i) % segments.length];
      if (!seg.sprites.length) continue;
      const p = seg.p1.screen;
      if (p.scale <= 0) continue;
      for (const sp of seg.sprites) {
        const sx = p.x + (p.scale * sp.side * sp.offset * ROAD_WIDTH * W/2);
        drawSprite(sp, sx, p.y, p.scale, seg._clip);
      }
    }
    const arr = [];
    for (const car of traffic) {
      const seg = findSegment(car.z);
      const rel = ((seg.index - baseSeg.index) + segments.length) % segments.length;
      if (rel > 0 && rel < DRAW_DIST) arr.push({ car, seg, rel });
    }
    arr.sort((a,b) => b.rel - a.rel);
    for (const { car, seg } of arr) {
      const p = seg.p1.screen;
      if (p.scale <= 0) continue;
      const sx = p.x + (p.scale * car.offset * ROAD_WIDTH * W/2);
      drawCar(sx, p.y, p.scale * 2.2, car.color, seg._clip);
    }
  }

  function drawSprite(sp, x, baseY, scale, clipY) {
    if (baseY > clipY + 4) return;
    const s = scale * W;
    if (sp.type === 'palm') {
      const h = s*220, tw = Math.max(2, s*14);
      ctx.fillStyle = '#7a5230'; ctx.fillRect(x-tw/2, baseY-h, tw, h);
      const fr = s*70;
      ctx.lineWidth = Math.max(2, s*10); ctx.strokeStyle = '#2e9e5b';
      for (let a=0;a<6;a++) {
        const ang = (a/6)*Math.PI*2;
        ctx.beginPath(); ctx.moveTo(x, baseY-h);
        ctx.quadraticCurveTo(x+Math.cos(ang)*fr*0.6, baseY-h-Math.abs(Math.sin(ang))*fr*0.4-fr*0.3, x+Math.cos(ang)*fr, baseY-h-fr*0.1);
        ctx.stroke();
      }
      ctx.fillStyle = '#caa14a'; ctx.beginPath(); ctx.arc(x, baseY-h, Math.max(2,s*10), 0, Math.PI*2); ctx.fill();
    } else if (sp.type === 'umbrella') {
      const hues = ['#e74c3c','#3498db','#f39c12','#fff'];
      const h = s*110, pw = Math.max(2, s*8), r = s*90;
      ctx.fillStyle = '#caa14a'; ctx.fillRect(x-pw/2, baseY-h, pw, h);
      ctx.fillStyle = hues[sp.hue % hues.length];
      ctx.beginPath(); ctx.moveTo(x-r, baseY-h);
      ctx.quadraticCurveTo(x, baseY-h-r*0.9, x+r, baseY-h); ctx.closePath(); ctx.fill();
    } else if (sp.type === 'building') {
      const bw = s*240*(sp.h||1), bh = s*520*(sp.h||1);
      const cols = ['#e8e0d4','#d8cab4','#cdbfa8'];
      ctx.fillStyle = cols[sp.hue % 3]; ctx.fillRect(x-bw/2, baseY-bh, bw, bh);
      ctx.fillStyle = 'rgba(90,120,150,0.55)';
      const wpad = bw*0.12, ww = bw*0.16, wh = bh*0.06;
      for (let wy=baseY-bh+wh; wy<baseY-wh; wy+=wh*2.2)
        for (let wx=x-bw/2+wpad; wx<x+bw/2-ww; wx+=ww*1.8) ctx.fillRect(wx, wy, ww, wh);
      ctx.fillStyle = '#c0392b'; ctx.fillRect(x-bw/2, baseY-bh, bw, Math.max(2, bh*0.04));
    }
  }

  function drawCar(x, baseY, scale, color, clipY) {
    if (baseY > clipY + 4) return;
    const w = scale * W * 380, h = w*0.62, top = baseY - h;
    ctx.fillStyle = 'rgba(0,0,0,0.22)';
    ctx.beginPath(); ctx.ellipse(x, baseY, w*0.55, h*0.16, 0, 0, Math.PI*2); ctx.fill();
    ctx.fillStyle = color; roundRect(x-w/2, top, w, h*0.78, Math.min(8,w*0.12)); ctx.fill();
    ctx.fillStyle = shade(color, -18); roundRect(x-w*0.32, top+h*0.06, w*0.64, h*0.38, Math.min(6,w*0.1)); ctx.fill();
    ctx.fillStyle = 'rgba(20,30,40,0.7)'; roundRect(x-w*0.27, top+h*0.1, w*0.54, h*0.24, 3); ctx.fill();
    ctx.fillStyle = '#ffce54';
    ctx.fillRect(x-w*0.46, top+h*0.52, w*0.12, h*0.16);
    ctx.fillRect(x+w*0.34, top+h*0.52, w*0.12, h*0.16);
  }

  function roundRect(x,y,w,h,r){
    ctx.beginPath();
    ctx.moveTo(x+r,y); ctx.arcTo(x+w,y,x+w,y+h,r); ctx.arcTo(x+w,y+h,x,y+h,r);
    ctx.arcTo(x,y+h,x,y,r); ctx.arcTo(x,y,x+w,y,r); ctx.closePath();
  }
  function shade(hex, amt){
    const c = hex.replace('#','');
    let r=parseInt(c.substr(0,2),16), g=parseInt(c.substr(2,2),16), b=parseInt(c.substr(4,2),16);
    r=Math.max(0,Math.min(255,r+amt)); g=Math.max(0,Math.min(255,g+amt)); b=Math.max(0,Math.min(255,b+amt));
    return `rgb(${r},${g},${b})`;
  }

  // ── PLAYER CAR ──
  function renderPlayer() {
    const bounce = (speed/MAX_SPEED) * Math.sin(performance.now()/60) * 1.5;
    const cx = W/2 + (keys.left ? -6 : keys.right ? 6 : 0);
    const baseY = H - H*0.06 + bounce;
    const w = Math.min(W,H)*0.18, h = w*0.6, top = baseY - h;

    ctx.fillStyle = 'rgba(0,0,0,0.28)';
    ctx.beginPath(); ctx.ellipse(cx, baseY+h*0.1, w*0.56, h*0.18, 0, 0, Math.PI*2); ctx.fill();

    const tilt = (keys.left ? -1 : keys.right ? 1 : 0) * 0.04;
    ctx.save(); ctx.translate(cx, baseY); ctx.rotate(tilt); ctx.translate(-cx, -baseY);
    ctx.fillStyle = '#e63946'; roundRect(cx-w/2, top, w, h*0.66, 10); ctx.fill();
    ctx.fillStyle = '#c92f3c'; roundRect(cx-w/2, top+h*0.4, w, h*0.4, 10); ctx.fill();
    ctx.fillStyle = '#3a2a22';
    roundRect(cx-w*0.3, top+h*0.16, w*0.24, h*0.3, 4); ctx.fill();
    roundRect(cx+w*0.06, top+h*0.16, w*0.24, h*0.3, 4); ctx.fill();
    ctx.fillStyle = 'rgba(180,220,240,0.6)'; roundRect(cx-w*0.34, top+h*0.04, w*0.68, h*0.16, 4); ctx.fill();
    ctx.fillStyle = '#ffce54';
    ctx.fillRect(cx-w*0.48, top+h*0.5, w*0.1, h*0.18);
    ctx.fillRect(cx+w*0.38, top+h*0.5, w*0.1, h*0.18);
    ctx.fillStyle = '#1a1a1a';
    ctx.fillRect(cx-w*0.52, top+h*0.62, w*0.14, h*0.3);
    ctx.fillRect(cx+w*0.38, top+h*0.62, w*0.14, h*0.3);
    ctx.restore();
  }

  // ── LOOP ──
  let lastT = 0;
  function frame(t) {
    requestAnimationFrame(frame);
    const dt = Math.min((t - lastT)/1000, 1/30); lastT = t;
    if (running && !paused) update(dt);
    Sound.update(speed / MAX_SPEED, playerX < -1 || playerX > 1);
    const baseSeg = findSegment(position);
    const basePercent = (position % SEG_LEN) / SEG_LEN;
    bgShift += baseSeg.curve * (speed/MAX_SPEED) * 12;
    ctx.clearRect(0, 0, W, H);
    renderBackground(baseSeg);
    renderRoad(baseSeg, basePercent);
    renderSprites(baseSeg);
    renderPlayer();
    hudDist.textContent  = Math.floor(distance).toLocaleString();
    hudSpeed.textContent = Math.floor((speed/MAX_SPEED)*220);
    hudBest.textContent  = Math.floor(best).toLocaleString();
  }

  // ── INPUT ──
  const hudDist = document.getElementById('hud-dist');
  const hudSpeed = document.getElementById('hud-speed');
  const hudBest = document.getElementById('hud-best');
  const overlay = document.getElementById('overlay');
  const startBtn = document.getElementById('start-btn');

  function startGame() { overlay.classList.add('hidden'); running = true; paused = false; keys.gas = true; Sound.init(); }
  function togglePause() {
    if (!running) return;
    paused = !paused;
    overlay.classList.toggle('hidden', !paused);
    overlay.querySelector('.ov-title').innerHTML = paused ? 'PAUSED' : 'COASTAL <em>DRIVE</em>';
    startBtn.textContent = paused ? '▸ Resume' : '▸ Start Driving';
  }
  startBtn.addEventListener('click', () => { if (paused) togglePause(); else startGame(); });

  window.addEventListener('keydown', e => {
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': keys.left = true; e.preventDefault(); break;
      case 'ArrowRight':case 'd': case 'D': keys.right = true; e.preventDefault(); break;
      case 'ArrowUp':   case 'w': case 'W': keys.gas = true; e.preventDefault(); break;
      case 'ArrowDown': case 's': case 'S': keys.brake = true; e.preventDefault(); break;
      case 'p': case 'P': togglePause(); break;
      case 'Enter': case ' ': if (!running) startGame(); break;
    }
  });
  window.addEventListener('keyup', e => {
    switch (e.key) {
      case 'ArrowLeft': case 'a': case 'A': keys.left = false; break;
      case 'ArrowRight':case 'd': case 'D': keys.right = false; break;
      case 'ArrowUp':   case 'w': case 'W': keys.gas = running; break;
      case 'ArrowDown': case 's': case 'S': keys.brake = false; break;
    }
  });

  const bind = (el, key) => {
    el.addEventListener('touchstart', e => { e.preventDefault(); keys[key] = true; if (!running) startGame(); }, { passive:false });
    el.addEventListener('touchend',   e => { e.preventDefault(); keys[key] = (key==='gas') ? running : false; }, { passive:false });
  };
  bind(document.getElementById('t-left'), 'left');
  bind(document.getElementById('t-right'), 'right');
  bind(document.getElementById('t-gas'), 'gas');

  // ── AUDIO ──
  const Sound = (() => {
    const AC = window.AudioContext || window.webkitAudioContext;
    let actx=null, master=null, engine=null, eGain=null, wGain=null;
    let started=false, enabled=(localStorage.getItem('coastal:sound')!=='0');
    let lastScreech=0;

    function init() {
      if (started || !AC) return;
      actx = new AC();
      master = actx.createGain();
      master.gain.value = enabled ? 0.6 : 0;
      master.connect(actx.destination);

      const eFilter = actx.createBiquadFilter();
      eFilter.type='lowpass'; eFilter.frequency.value=900;
      eGain = actx.createGain(); eGain.gain.value=0;
      eFilter.connect(eGain).connect(master);

      engine = actx.createOscillator(); engine.type='sawtooth'; engine.frequency.value=55;
      engine.connect(eFilter); engine.start();
      const engine2 = actx.createOscillator(); engine2.type='square'; engine2.frequency.value=27;
      const e2g = actx.createGain(); e2g.gain.value=0.5;
      engine2.connect(e2g).connect(eFilter); engine2.start();

      const nb = actx.createBuffer(1, actx.sampleRate*2, actx.sampleRate);
      const d = nb.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=Math.random()*2-1;
      const wind = actx.createBufferSource(); wind.buffer=nb; wind.loop=true;
      const wFilter = actx.createBiquadFilter(); wFilter.type='bandpass'; wFilter.frequency.value=600; wFilter.Q.value=0.5;
      wGain = actx.createGain(); wGain.gain.value=0;
      wind.connect(wFilter).connect(wGain).connect(master); wind.start();

      started = true;
    }

    function update(speedPct, offroad) {
      if (!started) return;
      const t = actx.currentTime;
      engine.frequency.setTargetAtTime(55 + speedPct*205, t, 0.06);
      eGain.gain.setTargetAtTime(0.07 + speedPct*0.13, t, 0.1);
      wGain.gain.setTargetAtTime(speedPct*speedPct*0.18 + (offroad?0.12:0), t, 0.12);
    }

    function screech(intensity) {
      if (!started || !enabled) return;
      const now = performance.now();
      if (now - lastScreech < 180) return;
      lastScreech = now;
      const t = actx.currentTime;
      const nb = actx.createBuffer(1, actx.sampleRate*0.3, actx.sampleRate);
      const d = nb.getChannelData(0);
      for (let i=0;i<d.length;i++) d[i]=(Math.random()*2-1)*(1-i/d.length);
      const src = actx.createBufferSource(); src.buffer=nb;
      const f = actx.createBiquadFilter(); f.type='bandpass'; f.frequency.value=2200; f.Q.value=6;
      const g = actx.createGain(); g.gain.value=Math.min(0.25, intensity*0.25);
      src.connect(f).connect(g).connect(master); src.start();
    }

    function toggle() {
      enabled = !enabled;
      localStorage.setItem('coastal:sound', enabled?'1':'0');
      if (master) master.gain.setTargetAtTime(enabled?0.6:0, actx.currentTime, 0.05);
      return enabled;
    }
    function isEnabled(){ return enabled; }
    return { init, update, screech, toggle, isEnabled };
  })();

  const soundBtn = document.getElementById('sound-toggle');
  function syncSound() {
    soundBtn.classList.toggle('muted', !Sound.isEnabled());
    soundBtn.textContent = Sound.isEnabled() ? '♫' : '♪';
  }
  syncSound();
  soundBtn.addEventListener('click', () => { Sound.init(); Sound.toggle(); syncSound(); });

  // ── BOOT ──
  buildTrack();
  trackLength = trackLen();
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>

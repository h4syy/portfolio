<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>404 · not found</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/site.css">
  <style>
    .wrap404 { min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 0.75rem; text-align: center; padding: 2rem; }
    .wrap404 h1 { font-size: clamp(5rem, 20vw, 11rem); font-weight: 600; line-height: 1; letter-spacing: -0.03em; }
    .wrap404 p { font-family: 'IBM Plex Mono', monospace; color: var(--dim); font-size: 0.9rem; letter-spacing: 0.04em; }
    .wrap404 a { font-family: 'IBM Plex Mono', monospace; color: var(--blue); font-size: 0.9rem; margin-top: 0.5rem; }
    .wrap404 a:hover { opacity: 0.8; }
  </style>
</head>
<body>
  <div class="wrap404">
    <h1>404</h1>
    <p>that route doesn’t exist.</p>
    <a href="/">cd ~ →</a>

</html>
